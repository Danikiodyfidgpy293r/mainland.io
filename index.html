<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Mainland</title>
<style>
  * { margin:0; padding:0; box-sizing:border-box; font-family:'Segoe UI', Arial, sans-serif; -webkit-tap-highlight-color:transparent; }
  :root {
    --accent:#5b6cff; --accent-2:#7b8cff; --bg:#f4f6fb; --card:#ffffff; --text:#1e2433; --muted:#8a90a3;
    --soft:#eef0fa; --soft2:#e7eaf5; --line:#dde1ee; --danger:#ff5b5b; --ok:#2ecc71;
  }
  body.dark {
    --bg:#12141d; --card:#1d2130; --text:#e8eaf2; --muted:#7d8499;
    --soft:#262b3d; --soft2:#2a3046; --line:#343b55;
  }
  body { background:var(--bg); color:var(--text); min-height:100vh; display:flex; align-items:center; justify-content:center; transition:background .3s, color:.3s; }
  .screen { display:none; width:100%; max-width:420px; padding:24px; }
  .screen.active { display:block; }
  .card { background:var(--card); border-radius:16px; padding:32px 28px; box-shadow:0 8px 30px rgba(30,36,51,.08); }
  .logo { text-align:center; font-size:28px; font-weight:800; color:var(--accent); margin-bottom:6px; }
  .subtitle { text-align:center; color:var(--muted); font-size:14px; margin-bottom:24px; }
  h2 { font-size:20px; margin-bottom:16px; }
  label { display:block; font-size:13px; color:var(--muted); margin:14px 0 6px; }
  input, button { width:100%; padding:12px 14px; border-radius:10px; font-size:15px; border:none; outline:none; font-family:inherit; }
  input { border:1px solid var(--line); background:var(--card); color:var(--text); transition:.2s; }
  input:focus { border-color:var(--accent); box-shadow:0 0 0 3px rgba(91,108,255,.12); }
  button { background:var(--accent); color:#fff; font-weight:600; cursor:pointer; margin-top:18px; transition:.2s; }
  button:hover { opacity:.9; }
  .link { text-align:center; margin-top:16px; font-size:14px; color:var(--muted); }
  .link a { color:var(--accent); cursor:pointer; text-decoration:none; font-weight:600; }
  .error { color:var(--danger); font-size:13px; margin-top:10px; min-height:18px; }
</style>
</head>
<body>

<!-- ЭКРАН ВХОДА -->
<div class="screen active" id="scr-login">
  <div class="card">
    <div class="logo">Mainland</div>
    <div class="subtitle">С возвращением!</div>
    <h2>Вход</h2>
    <label>Номер или почта</label>
    <input id="login-id" placeholder="+7 999... или email">
    <label>Пароль</label>
    <input id="login-pass" type="password" placeholder="••••••••">
    <button onclick="doLogin()">Войти</button>
    <div class="error" id="login-err"></div>
    <div class="link">Нет аккаунта? <a onclick="showScreen('scr-reg')">Зарегистрироваться</a></div>
  </div>
</div>

<!-- ЭКРАН РЕГИСТРАЦИИ -->
<div class="screen" id="scr-reg">
  <div class="card">
    <div class="logo">Mainland</div>
    <div class="subtitle">Регистрация</div>
    <h2>Новый аккаунт</h2>
    <label>Номер или почта</label>
    <input id="reg-id" placeholder="+7 999... или email">
    <label>Никнейм</label>
    <input id="reg-nick" placeholder="my_nickname">
    <label>Имя</label>
    <input id="reg-name" placeholder="Иван">
    <label>Пароль</label>
    <input id="reg-pass" type="password" placeholder="••••••••">
    <button onclick="doRegister()">Создать аккаунт</button>
    <div class="error" id="reg-err"></div>
    <div class="link">Уже есть аккаунт? <a onclick="showScreen('scr-login')">Войти</a></div>
  </div>
</div>

<!-- ЭКРАН УСПЕХА -->
<div class="screen" id="scr-main">
  <div class="card" style="text-align:center;">
    <div class="logo" style="font-size:48px;">✅</div>
    <h2>Вы в системе!</h2>
    <p style="color:var(--muted);margin-top:10px;">Скрипты работают. Аккаунт успешно создан и сохранён.</p>
    <button onclick="doLogout()">Выйти</button>
  </div>
</div>

<script>
const DB = {
  get users() { return JSON.parse(localStorage.getItem('ml_users') || '[]'); },
  set users(v) { localStorage.setItem('ml_users', JSON.stringify(v)); },
  get session() { return localStorage.getItem('ml_session'); },
  set session(v) { localStorage.setItem('ml_session', v); }
};

const $ = id => document.getElementById(id);
function showScreen(id) {
  document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
  $(id).classList.add('active');
}
function err(id, msg) { $(id).textContent = msg; }

function doRegister() {
  err('reg-err','');
  const contact = $('reg-id').value.trim();
  const nick = $('reg-nick').value.trim().toLowerCase();
  const name = $('reg-name').value.trim();
  const pass = $('reg-pass').value;
  
  if(!contact || !nick || !name || pass.length < 6) return err('reg-err', 'Заполните все поля (пароль от 6 символов)');
  
  const users = DB.users;
  if(users.some(u => u.nick === nick)) return err('reg-err', 'Ник занят');
  
  const user = { id: 'u'+Date.now(), contact, nick, name, pass };
  users.push(user);
  DB.users = users;
  DB.session = user.id;
  alert('Аккаунт создан!');
  showScreen('scr-main');
}

function doLogin() {
  err('login-err','');
  const contact = $('login-id').value.trim().toLowerCase();
  const pass = $('login-pass').value;
  
  const user = DB.users.find(u => u.contact.toLowerCase() === contact || u.nick === contact);
  if(!user || user.pass !== pass) return err('login-err', 'Неверный логин или пароль');
  
  DB.session = user.id;
  alert('Вход выполнен!');
  showScreen('scr-main');
}

function doLogout() {
  DB.session = null;
  showScreen('scr-login');
}

if(DB.session) showScreen('scr-main');
</script>
</body>
</html>
